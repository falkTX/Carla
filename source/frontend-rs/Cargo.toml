[package]
name = "franca-ui"
version = "2.6.0-alpha1"
edition = "2024"
license = "GPL-2.0-or-later"
description = "Native Rust desktop GUI for Franca audio plugin host"

[[bin]]
name = "franca-ui"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "glow", "system_fonts", "wayland", "x11"] }
rfd = "0.18"
libloading = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
arboard = "3.6"
open = "5.4"
libc = "0.2"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
